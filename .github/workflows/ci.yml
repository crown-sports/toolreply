name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: toolreply check examples/openai-fixed.json --format openai-chat --warnings-as-errors
      - run: toolreply check examples/anthropic-fixed.json --format anthropic --warnings-as-errors
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build ruff
      - run: ruff check . && ruff format --check .
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -I -m toolreply check examples/openai-fixed.json --format openai-chat
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  desktop-smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: toolreply check examples/openai-fixed.json --format openai-chat --warnings-as-errors
